# Stack local de dependências externas para o DeskcommCRM — DEV ONLY.
#
# Sobe WAHA + Redis (via serverless-redis-http, o mesmo par do compose de
# produção) + o worker do agent-engine. O banco NÃO mora aqui: Postgres + Auth +
# REST + Realtime + Storage vêm do Supabase local (`npx supabase start`, portas
# 54321-54324) — o app fala com GoTrue/PostgREST, não com um Postgres cru, então
# um serviço `postgres` solto neste arquivo não serviria. Supabase Cloud também
# funciona: basta apontar o `.env.local` para ele.
#
# Uso (receita completa em docs/SETUP.md e no CLAUDE.md, "Receita de ambiente fresco"):
#   1. npx supabase start  (com supabase/migrations fora do caminho — a cadeia
#      não sobe do zero) + extensões + psql -f supabase/baseline.sql
#   2. .env.local com as chaves do `npx supabase status -o env` e, para ESTE
#      arquivo, WAHA_API_KEY_SHA512 / WAHA_HMAC_SECRET / SRH_TOKEN
#      (hash: echo -n "$WAHA_API_KEY" | shasum -a 512 | awk '{print $1}')
#   3. docker compose --env-file .env.local up -d
#      O `--env-file` é o que faz o Compose interpolar ${...} a partir do
#      .env.local; sem ele só o `.env` é lido e as variáveis chegam vazias.
#   4. Dashboard do WAHA: http://localhost:3030/dashboard/
#      (host port 3030 — :3000 fica reservado pra outros dev tools como Remotion)
#
# Em prod, o compose é o docker-compose.prod.yml (VPS). Este arquivo é DEV ONLY.

services:
  waha:
    # Mesma tag pinada do docker-compose.prod.yml. A tag `noweb` antiga não
    # entendia o prefixo `sha512:` e comparava a api key literal → 401 no app.
    # Só existe build amd64: em Apple Silicon roda emulado.
    image: ${WAHA_IMAGE:-devlikeapro/waha:latest-2026.7.2}
    platform: linux/amd64
    container_name: deskcomm-waha
    restart: unless-stopped
    ports:
      - "3030:3000"
    environment:
      # Prefixo sha512: faz o WAHA HASHEAR o X-Api-Key recebido e comparar com
      # este hash. Sem o prefixo ele compara literal e o app (que manda o
      # plaintext) toma 401. Mesmo contrato do compose de produção.
      WAHA_API_KEY: "sha512:${WAHA_API_KEY_SHA512}"
      # host.docker.internal: o app Next roda no HOST em dev — localhost dentro do
      # container seria o próprio WAHA e o webhook nunca chegaria. Porta 3001: a
      # mesma que o supabase/config.toml libera nos redirects de auth (e que o CI usa).
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_BASE_URL:-http://host.docker.internal:3001}/api/v1/webhooks/waha
      WHATSAPP_HOOK_EVENTS: "message.any,message.ack,message.edited,message.revoked,session.status,state.change"
      # HMAC SHA512 do payload, validado server-side via crypto.timingSafeEqual.
      WHATSAPP_HOOK_HMAC: ${WAHA_HMAC_SECRET}
      # Engine NOWEB por default (mais leve, ~150MB; estável). O env é
      # WHATSAPP_DEFAULT_ENGINE — WAHA_DEFAULT_ENGINE NÃO existe no WAHA e caía
      # silenciosamente no default WEBJS (browser, trava a sessão).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # Storage de mídia: Supabase Storage via Backend (NÃO inline base64).
      WAHA_DASHBOARD_ENABLED: "true"
      # Sem isto o container volta (ou o Docker Desktop acorda) e as sessões
      # ficam STOPPED — o front abre em "Conectando…" e as mensagens do período
      # fora não chegam. True retoma as que já existiam; não pede QR de novo.
      WHATSAPP_RESTART_ALL_SESSIONS: "${WHATSAPP_RESTART_ALL_SESSIONS:-True}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - waha-data:/app/.sessions
      - waha-media:/app/.media
    healthcheck:
      # /ping é o único endpoint sem auth desta build (api/health = 401/404).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Redis efêmero (rate-limit/debounce) — sem porta publicada: quem fala com ele
  # é o srh abaixo, e a 6379 do host costuma estar ocupada por outro projeto.
  redis:
    image: redis:7-alpine
    container_name: deskcomm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # serverless-redis-http: o REST do Upstash sobre o redis local, então o SDK
  # @upstash/redis funciona sem nuvem. No .env.local:
  #   UPSTASH_REDIS_REST_URL=http://127.0.0.1:8079
  #   UPSTASH_REDIS_REST_TOKEN=<o mesmo SRH_TOKEN>
  # Mesmo digest do compose de produção.
  srh:
    image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
    container_name: deskcomm-srh
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${SRH_TOKEN}
      SRH_CONNECTION_STRING: "redis://redis:6379"
    ports:
      - "${SRH_PORT:-8079}:80"
    depends_on:
      redis:
        condition: service_healthy

  # Worker 24/7 do agent-engine (fusão Vendaval): fila, cron/follow-up, drain do
  # event_log e turnos do agente rico. Lê o mesmo .env.local do app.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: deskcomm-agent-worker
    restart: unless-stopped
    env_file:
      # `.env` é opcional em dev; sem `required: false` o compose recusa subir
      # quando ele não existe.
      - path: .env
        required: false
      - path: .env.local
    environment:
      # dentro do container, localhost é o próprio worker — o WAHA está na rede
      # do compose (serviço waha, porta interna 3000). Sobrepõe o .env.local.
      WAHA_API_BASE_URL: http://waha:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # O .env.local aponta Supabase local e srh para 127.0.0.1 (é o que o app, no
    # host, precisa). Dentro do container isso é o próprio worker, então as URLs
    # locais são reescritas para host.docker.internal antes de iniciar. URL de
    # nuvem (Supabase Cloud, Upstash) não casa com o padrão e passa intacta.
    entrypoint:
      - sh
      - -c
      - |
        for var in NEXT_PUBLIC_SUPABASE_URL SUPABASE_DB_URL UPSTASH_REDIS_REST_URL; do
          valor="$$(printenv "$$var")" || continue
          export "$$var=$$(printf '%s' "$$valor" | sed -E 's#(://|@)(127\.0\.0\.1|localhost)([:/]|$$)#\1host.docker.internal\3#')"
        done
        exec "$$@"
      - worker
    command: ["pnpm", "exec", "tsx", "workers/agent-worker/main.ts"]
    depends_on:
      waha:
        condition: service_started
      srh:
        condition: service_started
    ports:
      - "8787:8787"
    healthcheck:
      # 127.0.0.1 explícito: localhost resolve p/ ::1 e o healthz escuta só IPv4.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  waha-data:
  waha-media:
